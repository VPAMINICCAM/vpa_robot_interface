#!/usr/bin/env python3
PACKAGE = "vpa_robot_interface"
from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

gen.add("kp", double_t, 0, "p gain", 0.1, 0, 1)
gen.add("ki", double_t, 0, "I gain", 0.01, 0, 1)
gen.add("kff", double_t, 0, "Feedforward gain", 0.1, 0, 1)
gen.add("bff", double_t, 0, "Feedforward bias", 0.0, 0, 1)
gen.add("kp_yaw", double_t, 0, "Yaw PID p gain", 0.5, 0, 1)
gen.add("ki_yaw", double_t, 0, "Yaw PID i gain", 0.05, 0, 1)

exit(gen.generate(PACKAGE, "vpa_robot_interface", "omega"))
